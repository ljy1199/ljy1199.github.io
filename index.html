<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同人女XP二选一</title>
<style>
  :root {
    --bg: #faf5ff;
    --card: #ffffff;
    --text: #2d1b4e;
    --sub: #7c5cbf;
    --accent: #9333ea;
    --accent2: #db2777;
    --win: #fdf2f8;
    --border: #e9d5ff;
    --shadow: 0 4px 24px rgba(147, 51, 234, 0.10);
    --shadow-hover: 0 8px 32px rgba(147, 51, 234, 0.18);
    --vs-bg: linear-gradient(135deg, #9333ea, #db2777);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(147, 51, 234, 0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(219, 39, 119, 0.04) 0%, transparent 50%);
  }

  /* ---- header ---- */
  .header {
    text-align: center;
    padding: 32px 20px 12px;
    width: 100%;
    max-width: 800px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 800;
    background: var(--vs-bg);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
  }
  .header .subtitle {
    font-size: 14px;
    color: var(--sub);
    margin-top: 6px;
  }

  /* ---- progress ---- */
  .progress-wrap {
    width: 100%;
    max-width: 800px;
    padding: 0 24px 20px;
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--sub);
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--vs-bg);
    border-radius: 3px;
    transition: width 0.5s ease;
  }
  .round-tag {
    display: inline-block;
    background: var(--border);
    color: var(--accent);
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  /* ---- main area ---- */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 800px;
    padding: 0 24px 40px;
  }

  /* ---- VS arena ---- */
  .arena {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    max-width: 680px;
    margin-bottom: 24px;
  }
  .vs-badge {
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--vs-bg);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: 1px;
    z-index: 2;
    box-shadow: 0 2px 12px rgba(147, 51, 234, 0.3);
  }

  .card {
    flex: 1;
    min-width: 0;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
    border-color: var(--accent);
  }
  .card:active {
    transform: scale(0.97);
  }
  .card .card-text {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    position: relative;
    z-index: 1;
    line-height: 1.4;
  }
  .card .card-hint {
    font-size: 12px;
    color: var(--sub);
    margin-top: 8px;
    opacity: 0.6;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--vs-bg);
    opacity: 0;
    transition: opacity 0.3s ease;
    border-radius: 14px;
  }
  .card:hover::before {
    opacity: 0.04;
  }

  /* ---- selected / eliminated ---- */
  .card.selected {
    border-color: var(--accent);
    background: var(--win);
    animation: pulse 0.5s ease;
  }
  .card.eliminated {
    opacity: 0.3;
    transform: scale(0.94);
    pointer-events: none;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    30% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }

  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-40px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(40px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .card.anim-left { animation: slideInLeft 0.4s ease; }
  .card.anim-right { animation: slideInRight 0.4s ease; }

  /* ---- counter ---- */
  .counter {
    font-size: 14px;
    color: var(--sub);
    text-align: center;
    margin-bottom: 16px;
  }

  /* ---- buttons ---- */
  .btn {
    padding: 12px 36px;
    border: none;
    border-radius: 24px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
    letter-spacing: 1px;
  }
  .btn-primary {
    background: var(--vs-bg);
    color: #fff;
    box-shadow: 0 4px 16px rgba(147, 51, 234, 0.25);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(147, 51, 234, 0.35);
  }
  .btn-secondary {
    background: var(--card);
    color: var(--accent);
    border: 2px solid var(--border);
  }
  .btn-secondary:hover {
    border-color: var(--accent);
    background: var(--win);
  }

  /* ---- champion ---- */
  .champion-screen {
    text-align: center;
    animation: fadeInUp 0.6s ease;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .champion-card {
    display: inline-block;
    background: var(--card);
    border: 3px solid var(--accent);
    border-radius: 24px;
    padding: 40px 48px;
    box-shadow: 0 8px 40px rgba(147, 51, 234, 0.15);
    margin: 20px 0;
  }
  .champion-card .crown {
    font-size: 56px;
    margin-bottom: 8px;
    animation: bounce 1s ease infinite;
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .champion-card .champion-name {
    font-size: 36px;
    font-weight: 900;
    background: var(--vs-bg);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .champion-card .champion-label {
    font-size: 14px;
    color: var(--sub);
    margin-top: 4px;
  }
  .bracket-history {
    margin-top: 24px;
    font-size: 13px;
    color: var(--sub);
    line-height: 2;
    max-height: 200px;
    overflow-y: auto;
  }

  /* ---- start screen ---- */
  .start-screen {
    text-align: center;
    animation: fadeInUp 0.6s ease;
    padding: 40px 0;
  }
  .start-screen .emoji {
    font-size: 80px;
    margin-bottom: 16px;
  }
  .start-screen .desc {
    color: var(--sub);
    font-size: 15px;
    margin: 12px 0 24px;
    line-height: 1.8;
  }

  /* ---- round result ---- */
  .round-summary {
    text-align: center;
    margin-bottom: 20px;
    animation: fadeInUp 0.4s ease;
  }
  .round-summary h2 {
    font-size: 20px;
    color: var(--text);
    margin-bottom: 8px;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div class="header">
  <h1>同人女XP二选一</h1>
</div>

<div class="main" id="app"></div>

<script>
// ===================== DATA =====================
// 取 32 项（2^5），保证全程无轮空晋级
const ALL_ITEMS = [
  "恨海情天","破镜重圆","镜花水月","枯木逢春",
  "烂人真心","圣人私心","明月高悬","欢喜冤家",
  "宿敌变挚友","挚友变宿敌","宿敌","挚友",
  "相爱相杀","师徒","骨科","伪骨科",
  "爱而不得","先婚后爱","强制爱","默默守护",
  "青梅竹马","天降","年上","年下",
  "救赎","一起腐烂","暗恋","明恋",
  "双强","霸总娇妻","追妻火葬场","追夫火葬场"
];

// ===================== STATE =====================
let currentItems = [];   // items in current round
let winners = [];        // picked winners (one per pair, filled as user selects)
let currentPair = 0;     // which pair is active (0-indexed)
let roundNum = 0;        // round counter for display
let bracketLog = [];     // [{round, pair, left, right, picked}]

// ===================== SETUP =====================
function initGame() {
  currentItems = ALL_ITEMS.slice();
  winners = new Array(Math.floor(currentItems.length / 2)).fill(null);
  currentPair = 0;
  roundNum = 0;
  bracketLog = [];
  render();
}

// ===================== RENDER =====================
const app = document.getElementById('app');

function render() {
  // Champion?
  if (currentItems.length === 1) {
    renderChampion(currentItems[0]);
    return;
  }

  const totalPairs = currentItems.length / 2;

  // Current pair
  const i = currentPair * 2;
  const left  = currentItems[i];
  const right = currentItems[i + 1];
  const picked = winners[currentPair] !== null ? winners[currentPair] : null;

  const doneThisRound = winners.filter(w => w !== null).length;
  const progress = Math.round((doneThisRound / totalPairs) * 100);

  let roundLabel;
  const N = currentItems.length;
  if (totalPairs > 10) {
    roundLabel = `初赛（${N} 进 ${totalPairs}）`;
  } else if (totalPairs > 4) {
    roundLabel = `${N} 强晋级赛`;
  } else if (totalPairs > 1) {
    roundLabel = `半决赛（${N} 进 ${totalPairs}）`;
  } else {
    roundLabel = `🏆 决赛`;
  }

  app.innerHTML = `
    <div class="progress-wrap">
      <div class="round-tag">${roundLabel}</div>
      <div class="progress-info">
        <span>第 ${roundNum + 1} 轮 · 剩余 ${N} 项</span>
        <span>${doneThisRound} / ${totalPairs}</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${progress}%"></div>
      </div>
    </div>

    <div class="arena">
      <div class="card anim-left ${picked === left ? 'selected' : picked !== null ? 'eliminated' : ''}"
           onclick="pick(0)" id="card-left">
        <div class="card-text">${left}</div>
        <div class="card-hint">点我选择</div>
      </div>
      <div class="vs-badge">VS</div>
      <div class="card anim-right ${picked === right ? 'selected' : picked !== null ? 'eliminated' : ''}"
           onclick="pick(1)" id="card-right">
        <div class="card-text">${right}</div>
        <div class="card-hint">点我选择</div>
      </div>
    </div>

    <div class="counter">第 ${currentPair + 1} / ${totalPairs} 组</div>
  `;
}

// ===================== PICK =====================
function pick(side) {
  const i = currentPair * 2;
  const left  = currentItems[i];
  const right = currentItems[i + 1];
  const chosen = side === 0 ? left : right;

  // Record winner
  winners[currentPair] = chosen;

  bracketLog.push({
    round: roundNum,
    pair: currentPair,
    left, right,
    picked: chosen
  });

  // Advance
  setTimeout(() => {
    currentPair++;
    if (currentPair >= winners.length) {
      // Round complete → auto-advance
      currentItems = winners.filter(w => w !== null);
      // Only 1 item left = champion
      if (currentItems.length <= 1) {
        render();
        return;
      }
      // Setup next round
      winners = new Array(Math.floor(currentItems.length / 2)).fill(null);
      currentPair = 0;
      roundNum++;
      render();
    } else {
      render();
    }
  }, 400);
}

// ===================== CHAMPION =====================
function renderChampion(champion) {
  let historyHtml = '';
  bracketLog.forEach(b => {
    const rName = b.round === 0 ? '初赛' : `第${b.round + 1}轮`;
    historyHtml += `<div>${rName}｜${b.left} <b style="color:var(--accent)">VS</b> ${b.right} → <b style="color:var(--accent2)">${b.picked}</b></div>`;
  });

  app.innerHTML = `
    <div class="champion-screen">
      <div class="champion-card">
        <div class="crown">👑</div>
        <div class="champion-name">${champion}</div>
        <div class="champion-label">🏆 你的终极XP</div>
      </div>
      <p style="color:var(--sub);margin:8px 0 16px">
        历经 ${bracketLog.length} 次抉择，从 32 个XP中脱颖而出
      </p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="initGame()">再来一局</button>
        <button class="btn btn-secondary" onclick="showBracket()">查看对决记录</button>
      </div>
      <div class="bracket-history" id="bracket-detail" style="display:none">
        ${historyHtml}
      </div>
    </div>
  `;

  spawnConfetti();
}

function showBracket() {
  const el = document.getElementById('bracket-detail');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// ===================== CONFETTI =====================
function spawnConfetti() {
  const colors = ['#9333ea','#db2777','#f472b6','#c084fc','#e879f9','#facc15','#818cf8'];
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.style.cssText = `
        position: fixed; left: ${Math.random() * 100}vw; top: -20px;
        width: ${6 + Math.random() * 10}px; height: ${6 + Math.random() * 10}px;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
        pointer-events: none; z-index: 999;
        animation: confettiFall ${2 + Math.random() * 3}s ease-out forwards;
        animation-delay: ${Math.random() * 0.5}s;
      `;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }, i * 30);
  }
  const style = document.createElement('style');
  style.textContent = `
    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(100vh) rotate(${360 + Math.random() * 720}deg) scale(0.3); opacity: 0; }
    }
  `;
  document.head.appendChild(style);
}

// ===================== KEYBOARD =====================
document.addEventListener('keydown', e => {
  if ((e.key === 'ArrowLeft' || e.key === 'a') && winners[currentPair] === null) {
    pick(0);
  }
  if ((e.key === 'ArrowRight' || e.key === 'd') && winners[currentPair] === null) {
    pick(1);
  }
});

// ===================== INIT =====================
initGame();
</script>
</body>
</html>
